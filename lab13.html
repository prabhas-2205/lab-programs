<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fixed Flipped Background Example</title>
  <style>
    body { margin:0; height:200vh; }
    .background {
      position: fixed;
      top: 20%;
      left: 0;
      width: 100%;
      height: 200px;
      background-image: url('https://picsum.photos/id/1015/1200/800');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      transform: rotate(-15deg);
      z-index: -1;
      opacity: 0.85;
    }
    .content { padding: 50px; font-size: 20px; }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="content">
    <h1>Scroll Down</h1>
    <p>This page has a background image fixed halfway down and tilted horizontally.</p>
    <p>Keep scrolling — the image stays in place.</p>
  </div>
</body>
</html>
