<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlink Example</title>
</head>
<body>
    <h1>Demonstrating Hyperlinks in HTML</h1>

    <h2>1. Text Link using &lt;a&gt;, href, and target="_blank"</h2>
    <p>
        Visit <a href="https://adityauniversity.in/" target="_blank">Aditya University Website</a>.
    </p>

    <h2>2. Image Link using &lt;a&gt; and href</h2>
    <p>Click the image below to visit the <strong>Gallery page</strong>:</p>

    <a href="https://www.aec.edu.in/?p=Gallery" target="_blank">
        <img src="aditya_university.webp" width="200" height="150" alt="Aditya University">
    </a>
</body>
</html>
