<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CSS Styles Example</title>
  <!-- External CSS (assume style.css exists) -->
  <link rel="stylesheet" href="style.css">
  <!-- Internal CSS -->
  <style>
    body { background-color: coral; }
    .highlight { background: yellow; }
  </style>
</head>
<body>
  <!-- Inline CSS -->
  <h1 style="color:green; text-align:center;">This is a heading (inline)</h1>
  <p>This is a paragraph using external/internal CSS.</p>
  <p class="highlight">This uses internal CSS class "highlight".</p>
</body>
</html>
