<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JavaScript Output Methods</title>
</head>
<body>
  <h1>JavaScript Output Methods</h1>
  <p id="demo"></p>

  <script>
    alert("This is an alert box!");
    document.write("<p>Document.write() writes directly to the page.</p>");
    document.getElementById("demo").innerHTML = "innerHTML updates existing elements.";
    console.log("Message in console using console.log().");
  </script>
</body>
</html>
