<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Audio and Video Example</title>
</head>
<body>
  <h1>The Audio and Video Elements</h1>

  <p>Click on the play button to play a sound:</p>
  <audio controls>
    <source src="nature.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <p>Click on the play button to watch a video:</p>
  <video controls width="400">
    <source src="nature.mp4" type="video/mp4">
    Your browser does not support the video element.
  </video>

  <p>Here is the image you provided:</p>
  <img src="krishna.webp" alt="Sample Image" width="400">
</body>
</html>
