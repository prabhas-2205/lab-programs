<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JavaScript Event Handling</title>
<script>
  function changeColor(x) {
    x.style.backgroundColor = "lightgreen";
  }
  function displayMessage() {
    alert("Button clicked!");
  }
  function showText(sel) {
    document.getElementById("display").innerText =
      "You selected: " + sel.value;
  }
</script>
</head>
<body>
  <h1>JavaScript Event Handling Example</h1>
  <input type="text" placeholder="Hover over me" onmouseover="changeColor(this)">
  <button onclick="displayMessage()">Click Me</button>
  <br><br>
  <select onchange="showText(this)">
    <option>Select</option>
    <option>HTML</option>
    <option>CSS</option>
    <option>JavaScript</option>
  </select>
  <p id="display"></p>
</body>
</html>
